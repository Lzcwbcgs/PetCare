# https://goframe.org/docs/web/server-config-file-template
server:
  address: ":8000"
  openapiPath: "/api.json"
  swaggerPath: "/swagger"

# https://goframe.org/docs/core/glog-config
logger:
  level: "all"
  stdout: true

# https://goframe.org/docs/core/gdb-config-file
database:
  default:
    link: "mysql:root:123456@tcp(127.0.0.1:3306)/pet_medical_system"

auth:
  jwtSecret: "petcare-dev-secret"
  jwtIssuer: "petcare"
  expireHours: 24

ai:
  defaultProvider: "api"
  embeddingProvider: "local"
  requestTimeoutSeconds: 120
  historyLimit: 20
  systemPrompt: ""
  providers:
    api:
      baseUrl: "https://api.deepseek.com/v1"
      apiKey: "sk-9a61af5d75314c2b9cffb294badcd88e"
      chatModel: "deepseek-chat"
      embeddingModel: "text-embedding-3-small"
    local:
      engine: "ollama"
      baseUrl: "http://127.0.0.1:11434"
      chatModel: "qwen2.5:7b"
      embeddingModel: "bge-m3"

rag:
  enabled: true
  topK: 4
  chunkSize: 700
  chunkOverlap: 120
  vectorStore:
    type: "qdrant"
    qdrant:
      baseUrl: "https://29635c67-ea78-487a-a53d-48cc92d930e6.sa-east-1-0.aws.cloud.qdrant.io"
      apiKey: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJhY2Nlc3MiOiJtIiwic3ViamVjdCI6ImFwaS1rZXk6MDNlN2U4ZWUtNTg5NC00OTFhLWE4NmQtMjQwOTYxMmNkNDEyIn0.etsHYTFn6-YxDCb-E-B2JQv-F5LSis2xCIrR3lmwGzI"
