                    description: 手机号
                    format: string
                    type: string
                specialty:
                    description: 擅长领域
                    format: string
                    maxLength: 255
                    minLength: 1
                    type: string
                status:
                    description: 状态：1在职可接诊，0停用
                    enum:
                        - 0
                        - 1
                    format: int
                    type: integer
                title:
                    description: 职称
                    format: string
                    maxLength: 50
                    minLength: 1
                    type: string
                username:
                    description: 医生登录账号
                    format: string
                    maxLength: 32
                    minLength: 3
                    type: string
            required:
                - hospital_id
                - username
                - password
                - doctor_name
                - gender
                - phone
                - title
                - specialty
                - status
            type: object
