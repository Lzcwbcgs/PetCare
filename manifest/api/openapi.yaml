info:
    description: 宠物医疗协同管理平台接口文档
    title: PetCare API
    version: ""
openapi: 3.0.0
paths:
    /api/admin/doctors:
        get:
            parameters:
                - description: 页码
                  in: query
                  name: page
                  schema:
                    description: 页码
                    format: '*int'
                    type: integer
                - description: 每页数量
                  in: query
                  name: page_size
                  schema:
                    description: 每页数量
                    format: '*int'
                    type: integer
                - description: 所属医院ID
                  in: query
                  name: hospital_id
                  schema:
                    description: 所属医院ID
                    format: '*int64'
                    type: integer
                - description: 状态：1在职可接诊，0停用
                  in: query
                  name: status
                  schema:
                    description: 状态：1在职可接诊，0停用
                    enum:
                        - 0
                        - 1
                    format: '*int'
                    type: integer
                - description: 医生姓名关键字
                  in: query
                  name: keyword
                  schema:
                    description: 医生姓名关键字
                    format: '*string'
                    type: string
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                properties:
                                    code:
                                        description: 业务状态码
                                        format: int
                                        type: integer
                                    data:
                                        description: 响应数据
                                        properties:
                                            list:
                                                description: 医生列表
                                                format: '[]v1.DoctorListItem'
                                                items:
                                                    $ref: '#/components/schemas/PetCare.api.admin.v1.DoctorListItem'
                                                    description: ""
                                                type: array
                                            pagination:
                                                $ref: '#/components/schemas/PetCare.api.admin.v1.Pagination'
                                                description: 分页信息
                                        type: object
                                    message:
                                        description: 响应消息
                                        format: string
                                        type: string
                                type: object
                    description: ""
            summary: 获取医生列表
            tags:
                - 医生管理
        post:
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/PetCare.api.admin.v1.DoctorCreateReq'
                            description: ""
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                properties:
                                    code:
                                        description: 业务状态码
                                        format: int
                                        type: integer
                                    data:
                                        description: 响应数据
                                        properties:
                                            doctor_id:
                                                description: 新建医生ID
                                                format: int64
                                                type: integer
                                        type: object
                                    message:
                                        description: 响应消息
                                        format: string
                                        type: string
                                type: object
                    description: ""
            summary: 新增医生
            tags:
                - 医生管理
    /api/admin/doctors/{doctor_id}:
        delete:
            parameters:
                - description: 医生ID
                  in: path
                  name: doctor_id
                  required: true
                  schema:
                    description: 医生ID
                    format: int64
                    type: integer
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                properties:
                                    code:
                                        description: 业务状态码
                                        format: int
                                        type: integer
                                    data:
                                        description: 响应数据
                                        properties: {}
                                        type: object
                                    message:
                                        description: 响应消息
                                        format: string
                                        type: string
                                type: object
                    description: ""
            summary: 删除医生
            tags:
                - 医生管理
        get:
            parameters:
                - description: 医生ID
                  in: path
                  name: doctor_id
                  required: true
                  schema:
                    description: 医生ID
                    format: int64
                    type: integer
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                properties:
                                    code:
                                        description: 业务状态码
                                        format: int
                                        type: integer
                                    data:
                                        description: 响应数据
                                        properties:
                                            avatar_url:
                                                description: 头像URL
                                                format: string
                                                type: string
                                            created_at:
                                                description: 创建时间
                                                format: string
                                                type: string
                                            doctor_name:
                                                description: 医生姓名
                                                format: string
                                                type: string
                                            email:
                                                description: 邮箱
                                                format: string
                                                type: string
                                            gender:
                                                description: 性别
                                                format: int
                                                type: integer
                                            hospital_id:
                                                description: 所属医院ID
                                                format: int64
                                                type: integer
                                            id:
                                                description: 医生ID
                                                format: int64
                                                type: integer
                                            intro:
                                                description: 医生简介
                                                format: string
                                                type: string
                                            phone:
                                                description: 手机号
                                                format: string
                                                type: string
                                            specialty:
                                                description: 擅长领域
                                                format: string
                                                type: string
                                            status:
                                                description: 状态
                                                format: int
                                                type: integer
                                            title:
                                                description: 职称
                                                format: string
                                                type: string
                                            updated_at:
                                                description: 更新时间
                                                format: string
                                                type: string
                                            username:
                                                description: 医生登录账号
                                                format: string
                                                type: string
                                        type: object
                                    message:
                                        description: 响应消息
                                        format: string
                                        type: string
                                type: object
                    description: ""
            summary: 获取医生详情
            tags:
                - 医生管理
        put:
            parameters:
                - description: 医生ID
                  in: path
                  name: doctor_id
                  required: true
                  schema:
                    description: 医生ID
                    format: int64
                    type: integer
            requestBody:
                content:
                    application/json:
                        schema:
                            properties:
                                avatar_url:
                                    description: 头像URL
                                    format: '*string'
                                    maxLength: 255
                                    type: string
                                doctor_name:
                                    description: 医生姓名
                                    format: '*string'
                                    maxLength: 50
                                    minLength: 1
                                    type: string
                                email:
                                    description: 邮箱
                                    format: '*string'
                                    type: string
                                gender:
                                    description: 性别：1男，2女，0未知
                                    enum:
                                        - 0
                                        - 1
                                        - 2
                                    format: '*int'
                                    type: integer
                                hospital_id:
                                    description: 所属医院ID
